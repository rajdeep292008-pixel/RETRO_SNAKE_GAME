<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE NEON-RETRO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0c;
            --snake-color: #00ff41;
            --food-color: #ff3131;
            --ui-accent: #008f11;
            --crt-overlay: rgba(18, 16, 16, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--snake-color);
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Fixed height for Firefox */
            overflow: hidden;
            touch-action: none;
        }

        /* CRT Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(var(--crt-overlay) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            border: 4px solid var(--ui-accent);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 { font-size: clamp(2rem, 10vw, 4rem); text-shadow: 0 0 10px var(--snake-color); }
        button {
            background: transparent;
            border: 2px solid var(--snake-color);
            color: var(--snake-color);
            padding: 10px 30px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover { background: var(--snake-color); color: #000; }

        #ui-bar {
            width: 90vw;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            padding-bottom: 10px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div>SCORE: <span id="current-score">000</span></div>
        <div>BEST: <span id="high-score">000</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1>SNAKE_RETRO</h1>
            <p>Relive the classic memories.</p>
            <button id="start-btn">PRESS START</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: var(--food-color);">GAME OVER</h1>
            <p>SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        
        let audioCtx = null;
        const GRID_SIZE = 20;
        let tileCount = 20;
        let gameSpeed = 100;
        let score = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0, dy = 0;
        let nextDx = 1, nextDy = 0;
        let gameActive = false;
        let lastTime = 0;

        // Load High Score
        let highScore = localStorage.getItem('snakeHigh') || 0;
        highScoreEl.innerText = String(highScore).padStart(3, '0');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function setupCanvas() {
            canvas.width = 400;
            canvas.height = 400;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            nextDx = 1; nextDy = 0;
            dx = 1; dy = 0;
            score = 0;
            gameSpeed = 100;
            scoreEl.innerText = "000";
            spawnFood();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            const delta = timestamp - lastTime;
            if (delta > gameSpeed) {
                lastTime = timestamp;
                moveSnake();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function moveSnake() {
            dx = nextDx; dy = nextDy;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
                snake.some(s => s.x === head.x && s.y === head.y)) {
                return endGame();
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = String(score).padStart(3, '0');
                playSound(440, 0.1);
                spawnFood();
                if (gameSpeed > 50) gameSpeed -= 1;
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Food
            ctx.fillStyle = varColor('--food-color');
            ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);

            // Snake
            snake.forEach((p, i) => {
                ctx.fillStyle = i === 0 ? varColor('--snake-color') : varColor('--ui-accent');
                ctx.fillRect(p.x * GRID_SIZE + 1, p.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function endGame() {
            gameActive = false;
            playSound(100, 0.3);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHigh', highScore);
                highScoreEl.innerText = String(highScore).padStart(3, '0');
            }
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Controls
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -1; }
            if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = 1; }
            if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -1; nextDy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { nextDx = 1; nextDy = 0; }
        });

        document.getElementById('start-btn').onclick = () => {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            gameActive = true;
            setupCanvas();
            resetGame();
            requestAnimationFrame(gameLoop);
        };

        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            gameActive = true;
            resetGame();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
